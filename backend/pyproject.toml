[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "arhmm7", email = "arhmm7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.1.0",
    "pyjwt[crypto]>=2.15.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
    "alembic>=1.20.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
